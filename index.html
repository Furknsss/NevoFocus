    <script src="/twa-bootstrap.js"></script>
    <script>
      (function () {
        if (typeof window === 'undefined') return;

        // 1. Silence any Vite HMR / WebSocket console error or warning
        const shouldSilence = function (args) {
          try {
            const text = Array.prototype.map
              .call(args, function (a) {
                if (!a) return '';
                if (typeof a === 'string') return a;
                if (a.message) return String(a.message);
                return String(a);
              })
              .join(' ');
            return (
              text.includes('[vite]') ||
              text.includes('vite-hmr') ||
              text.includes('WebSocket') ||
              text.includes('ws://') ||
              text.includes('wss://') ||
              text.includes('server connection lost') ||
              text.includes('failed to connect to websocket')
            );
          } catch {
            return false;
          }
        };

        const origError = console.error;
        const origWarn = console.warn;
        console.error = function () {
          if (shouldSilence(arguments)) return;
          return origError.apply(console, arguments);
        };
        console.warn = function () {
          if (shouldSilence(arguments)) return;
          return origWarn.apply(console, arguments);
        };

        // 2. Intercept Vite HMR / Ping WebSockets BEFORE /@vite/client runs in <head>
        if (!window.WebSocket) return;
        const NativeWebSocket = window.WebSocket;
        const DummyWebSocket = function (url, protocols) {
          const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          const urlStr = String(url || '');
          const isViteHmr =
            protoStr.includes('vite-hmr') ||
            protoStr.includes('vite-ping') ||
            urlStr.includes('vite-hmr') ||
            (urlStr.includes(window.location.host) &&
              !urlStr.includes('firestore') &&
              !urlStr.includes('firebase') &&
              !urlStr.includes('googleapis'));

          if (isViteHmr) {
            const listeners = { open: [], message: [], error: [], close: [] };
            const fakeWs = {
              url: urlStr,
              readyState: 1, // OPEN — prevents "WebSocket closed without opened" and prevents reconnect polling!
              protocol: protoStr.split(',')[0] || 'vite-hmr',
              extensions: '',
              bufferedAmount: 0,
              binaryType: 'blob',
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              send: function () {},
              close: function () {
                fakeWs.readyState = 3;
              },
              addEventListener: function (type, cb) {
                if (listeners[type] && typeof cb === 'function') {
                  listeners[type].push(cb);
                }
              },
              removeEventListener: function (type, cb) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function (fn) {
                    return fn !== cb;
                  });
                }
              },
              dispatchEvent: function () {
                return true;
              },
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
            };

            setTimeout(function () {
              const openEv = { type: 'open', target: fakeWs };
              if (typeof fakeWs.onopen === 'function') {
                try {
                  fakeWs.onopen(openEv);
                } catch {}
              }
              listeners.open.forEach(function (fn) {
                try {
                  fn(openEv);
                } catch {}
              });

              const msgEv = { type: 'message', data: '{"type":"connected"}', target: fakeWs };
              if (typeof fakeWs.onmessage === 'function') {
                try {
                  fakeWs.onmessage(msgEv);
                } catch {}
              }
              listeners.message.forEach(function (fn) {
                try {
                  fn(msgEv);
                } catch {}
              });
            }, 15);

            return fakeWs;
          }

          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        };
        DummyWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        DummyWebSocket.OPEN = NativeWebSocket.OPEN;
        DummyWebSocket.CLOSING = NativeWebSocket.CLOSING;
        DummyWebSocket.CLOSED = NativeWebSocket.CLOSED;
        DummyWebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket = DummyWebSocket;
      })();
    </script>
