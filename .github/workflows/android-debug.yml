name: Android NevoFocus Debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'native/android/**'
      - 'scripts/setup-android.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/android-debug.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package.json'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use runner Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run lint
      - name: Generate Android project and native focus service
        run: npm run android:setup
      - name: Compile installable debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - name: Print Android debug signing certificate fingerprints
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android \
            | grep -E 'SHA1:|SHA256:' | tee android-debug-signing-fingerprints.txt
          echo "Copy SHA1 into the Google Cloud Android OAuth client configuration."
      - name: Publish APK and signing fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: nevofocus-android-auth-test-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-debug-signing-fingerprints.txt
          if-no-files-found: error
          retention-days: 14
