name: Legacy Capsule Compatibility Verification

on:
  push:
    branches: ['feat/twa-premium-native-focus-20261104']
    paths: ['.github/workflows/android-twa-capsule-compat.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nevofocus-legacy-capsule-release
  cancel-in-progress: true

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEVOFOCUS_LEGACY_CAPSULE: '1'
      NEVOFOCUS_TWA_SIGNING_STORE: ${{ github.workspace }}/.signing/nevofocus-debug.keystore
      NEVOFOCUS_TWA_URL: https://nevofocus.vercel.app/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51f8929189862176cfc05514ecca2e000a95721e
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the installed APK signing identity
        uses: actions/cache/restore@v4
        with:
          path: .signing/nevofocus-debug.keystore
          key: nevofocus-twa-debug-signing-v2
      - name: Refuse incompatible signing identities
        run: |
          test -s .signing/nevofocus-debug.keystore
          keytool -list -v -keystore .signing/nevofocus-debug.keystore -storepass android -alias androiddebugkey > /tmp/nevofocus-cert.txt
          grep -F '0D:33:E8:2B:75:E3:0D:77:56:59:54:69:3C:94:83:28:91:7C:14:DC:78:35:51:19:69:66:1B:01:D3:8C:DE:F8' /tmp/nevofocus-cert.txt
      - name: Make room for an actual Chrome and SystemUI emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h /
      - name: Install and verify the website source
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run test:unit
          node scripts/setup-twa-android.mjs
          git rev-parse HEAD > android-twa-source-commit.txt
      - name: Build signed native app and integration tests
        run: cd android && chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Verify exact APK certificate on the live origin
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APK_SIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee android-twa-apk-signature.txt
          node scripts/generate-twa-assetlinks.mjs android-twa-apk-signature.txt android-twa-assetlinks.json
          node scripts/verify-twa-assetlinks.mjs "$NEVOFOCUS_TWA_URL" android-twa-assetlinks.json
          node --input-type=module -e "const r=await fetch(new URL('twa-bootstrap.js',process.env.NEVOFOCUS_TWA_URL)); if(!r.ok || !(await r.text()).includes('android-app://')) throw Error('Live origin must serve the Android-app origin fix before Chrome integration')"
      - name: Upload 1.2.5 device-test candidate before Chrome integration
        uses: actions/upload-artifact@v4
        with:
          name: nevofocus-1.2.5-notification-candidate-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-twa-apk-signature.txt
            android-twa-source-commit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify live website has matching Focus-notification diagnostic
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = new URL('/native-check.html', process.env.NEVOFOCUS_TWA_URL);
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error('LIVE_SITE_UNAVAILABLE: ' + url + ' HTTP ' + response.status);
          const body = await response.text();
          if (!body.includes('FOCUS_TEST_OTURUMUNU_HAZIRLA')) {
            throw new Error('STALE_LIVE_SITE: signed 1.2.5 native APK requires the new Focus restore test on ' + url +
              '. The website has not been deployed yet. Publish the matching commit before running real Chrome E2E.');
          }
          console.log('Live diagnostic page is compatible with this native APK.');
          JS
      - name: Prepare one persistent emulator shell with final evidence capture
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/chrome-snapshot.mjs" <<'JS'
          const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
          const result = [];
          for (const target of targets.filter(t => t.type === 'page')) {
            const ws = new WebSocket(target.webSocketDebuggerUrl);
            const evaluation = await new Promise(resolve => {
              const timeout = setTimeout(() => { ws.close(); resolve({timeout:true}); }, 5000);
              ws.onopen = () => ws.send(JSON.stringify({id:1,method:'Runtime.evaluate',params:{
                expression: 'JSON.stringify({href:location.href,title:document.title,text:document.body?.innerText?.slice(0,1800),bootstrap:window.__nevoTwaBootstrap && {status:window.__nevoTwaBootstrap.status,received:window.__nevoTwaBootstrap.received,nativeMessage:window.__nevoTwaBootstrap.nativeMessage},queued:window.__nevoTwaBootstrap?.channels?.map(c=>c.messages),resources:performance.getEntriesByType("resource").map(r=>r.name.split("?")[0])})',
                returnByValue:true
              }}));
              ws.onmessage = event => { const value = JSON.parse(event.data); if(value.id===1) { clearTimeout(timeout); ws.close(); resolve(value); } };
              ws.onerror = () => { clearTimeout(timeout); resolve({error:true}); };
            });
            result.push({url:target.url,evaluation});
          }
          console.log(JSON.stringify(result,null,2));
          JS
          cat > "$RUNNER_TEMP/nevofocus-chrome-e2e.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          capture_evidence() {
            adb logcat -d -s NevoFocusTwa NevoFocusChromeTest AndroidRuntime chromium > "$GITHUB_WORKSPACE/chrome-logcat.txt" || true
            adb forward tcp:9222 localabstract:chrome_devtools_remote || true
            node "$RUNNER_TEMP/chrome-snapshot.mjs" > "$GITHUB_WORKSPACE/chrome-devtools.json" 2>&1 || true
            for evidence in nevofocus-focus-after-notification-tap.png nevofocus-chrome-notification.png nevofocus-emulator-notification.png chrome-failure.png chrome-ui.xml nevofocus-compat-ui.xml; do
              adb exec-out run-as com.furknsss.nevofocus cat "files/$evidence" > "$GITHUB_WORKSPACE/$evidence" 2>/dev/null || true
            done
          }
          trap capture_evidence EXIT
          adb shell pm path com.android.chrome
          chrome_version=$(adb shell dumpsys package com.android.chrome | sed -n 's/.*versionName=//p' | head -1 | tr -d '\r')
          echo "Real Chrome version: $chrome_version"
          chrome_major=$(echo "$chrome_version" | cut -d. -f1)
          test "$chrome_major" -ge 115
          adb shell am set-debug-app --persistent com.android.chrome
          adb shell 'echo "chrome --disable-fre --no-first-run --no-default-browser-check --disable-background-networking --disable-component-update --force-renderer-accessibility" > /data/local/tmp/chrome-command-line'
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.furknsss.nevofocus android.permission.POST_NOTIFICATIONS
          adb shell am start -a android.intent.action.VIEW -d about:blank -p com.android.chrome
          cd android
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.chromeE2e=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon
          BASH
      - name: Real Chrome DAL handshake, web start, app notification and actual controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          ram-size: 4096M
          disable-animations: true
          script: bash "$RUNNER_TEMP/nevofocus-chrome-e2e.sh"
      - name: Save actual Chrome and native notification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevofocus-compat-chrome-results
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            chrome-logcat.txt
            chrome-devtools.json
            chrome-ui.xml
            nevofocus-compat-ui.xml
            chrome-failure.png
            nevofocus-chrome-notification.png
            nevofocus-focus-after-notification-tap.png
            nevofocus-emulator-notification.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK only after Chrome integration succeeds
        uses: actions/upload-artifact@v4
        with:
          name: nevofocus-legacy-capsule-verified-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-twa-apk-signature.txt
            android-twa-source-commit.txt
          if-no-files-found: error
          retention-days: 14
