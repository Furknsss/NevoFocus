name: Calendar Date Selection Verification
on:
  push:
    branches: ['fix/chrome-native-notification-bridge-20261105']
    paths: ['src/**', 'tests/manualRestDays.test.ts', 'e2e/manual-rest-calendar.mjs', 'e2e/focus-mode-settings.mjs', 'tests/nativeNotificationFocusRouting.test.mjs', 'tests/focusControlsAppearance.test.mjs', '.github/workflows/web-calendar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nevofocus-calendar-web
  cancel-in-progress: true
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint && npm run test:unit && npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify actual calendar interactions in an isolated offline guest profile
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nevo-calendar-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          node e2e/manual-rest-calendar.mjs
          node e2e/focus-mode-settings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nevofocus-calendar-ui-results
          path: |
            calendar-selection-mobile.png
            calendar-failure.png
            focus-settings-mobile.png
            focus-settings-desktop.png
            focus-compact-controls-mobile.png
            focus-compact-controls-desktop.png
            focus-settings-failure.png
          if-no-files-found: ignore
          retention-days: 7
