name: NevoFocus Public Origin Preflight
on:
  push:
    branches: ['feat/twa-premium-native-focus-20261104']
    paths: ['.github/workflows/nevo-origin-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the exact anonymous URLs used by Chrome
        run: |
          node --input-type=module <<'NODE'
          for (const [path, marker] of [['/native-check.html?nevofocus_twa=1', 'BILDIRIMI_BASLAT'], ['/twa-bootstrap.js', '__nevoTwaBootstrap'], ['/', 'twa-bootstrap.js']]) {
            const response = await fetch('https://nevofocus.vercel.app' + path, {redirect: 'manual'});
            const body = await response.text();
            console.log(JSON.stringify({path,status:response.status,location:response.headers.get('location'),contentType:response.headers.get('content-type'),markerPresent:body.includes(marker),title:body.match(/<title>(.*?)<\/title>/s)?.[1]}));
          }
          NODE
